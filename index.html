<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="style sheet" href="style.css">
</head>
<body>
    <main class="app container"
    <header class="app-header">
        <h1> RENT WISE</h1>
        <p> Know your share . Know your budget.</p>
    </header>

    <section class="grid-summary">
        <div class="your-numbers card">
            <h2> YOUR NUMBERS</h2>

            <div class="input-group">
                <label for="Income">MONTHLY INCOME</label>
                <input id="Income" type="number" value="50000" />
            </div>

            <div class="input group">
                <label for="Rent">
                    Monthly Rent 
                </label>
                <input id="rent" type="number" value="15000" />

                </div>

                <div input="input-group">
                    <label for="utilities">Utilities</label>
                    <input id="utilities" type="number" value="3000" /> 
                
                </div>
                <div class="input-group">
                    <label for="people">Number of People</label>
                    <input id="people" type="number" value="4" min="1"/>
                </div>



           
        </div>

    </section>
</body>
</html>
